<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PATEL CYBER TOOL - NEXT GEN OSINT</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-deep: #020617; --bg-card: #090d19; --primary: #06b6d4; --secondary: #3b82f6; --accent: #10b981; --text-muted: #94a3b8; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg-deep); color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; background-image: radial-gradient(circle at 10% 10%, rgba(6, 182, 212, 0.1) 0%, transparent 40%); }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade { animation: fadeIn 0.6s ease forwards; opacity: 0; }
        
        .main-header { width: 100%; background: rgba(9, 13, 25, 0.9); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(255,255,255,0.08); padding: 15px 20px; position: sticky; top: 0; z-index: 100; }
        .header-container { max-width: 650px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .brand-box { display: flex; align-items: center; gap: 14px; }
        .brand-logo-wrap { width: 45px; height: 45px; border-radius: 12px; background: linear-gradient(135deg, #06b6d4, #3b82f6); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 15px rgba(6,182,212,0.4); }
        .brand-title h1 { font-family: 'Orbitron'; font-size: 16px; font-weight: 800; }
        .brand-title span { font-size: 10px; color: var(--primary); letter-spacing: 2px; }

        .main-container { max-width: 650px; width: 100%; padding: 20px; flex: 1; }
        
        .card { background: var(--bg-card); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 25px; margin-bottom: 30px; box-shadow: 0 15px 40px rgba(0,0,0,0.5); }
        .form-group { margin-bottom: 20px; }
        .input-group { display: flex; background: #020617; border: 2px solid rgba(255,255,255,0.08); border-radius: 12px; overflow: hidden; }
        .input-group input { flex: 1; background: transparent; border: none; padding: 15px; color: #fff; outline: none; }
        .btn-action { width: 100%; padding: 15px; background: linear-gradient(135deg, var(--primary), var(--secondary)); border: none; border-radius: 12px; color: #fff; font-weight: 700; font-family: 'Orbitron'; cursor: pointer; }

        /* NEW VIP LOGIN SECTION DESIGN */
        .vip-section { background: linear-gradient(180deg, #090d19 0%, #020617 100%); border: 1px solid #10b981; border-radius: 20px; padding: 25px; text-align: center; position: relative; box-shadow: 0 10px 30px rgba(16, 185, 129, 0.15); }
        .vip-section i.bg-icon { position: absolute; font-size: 120px; color: rgba(16, 185, 129, 0.05); top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 0; }
        .vip-content { position: relative; z-index: 1; }
        .vip-title { color: #10b981; font-family: 'Orbitron'; font-size: 18px; margin-bottom: 10px; letter-spacing: 1px; }
        .vip-desc { color: var(--text-muted); font-size: 12px; margin-bottom: 25px; line-height: 1.5; }

        /* BUTTON FIX - NO CLIPPING */
        .btn-wrapper { position: relative; display: inline-block; width: 100%; }
        .btn-private-access { display: flex; justify-content: center; align-items: center; gap: 10px; width: 100%; padding: 18px; background: #020617; border: 2px solid #10b981; border-radius: 12px; color: #10b981; font-size: 14px; font-weight: 800; text-decoration: none; font-family: 'Orbitron'; text-transform: uppercase; transition: 0.3s; position: relative; overflow: hidden; }
        
        /* LASER ANIMATION INSIDE BUTTON */
        .btn-private-access::before { content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%; background: linear-gradient(90deg, transparent, rgba(16, 185, 129, 0.4), transparent); transform: skewX(-20deg); animation: laser 3s infinite; }
        @keyframes laser { 0% { left: -100%; } 100% { left: 200%; } }
        
        .btn-private-access:hover { background: #10b981; color: #000; box-shadow: 0 0 25px rgba(16, 185, 129, 0.6); }

        /* FIXED NEW BADGE - Outside button so it doesn't get clipped */
        .badge-new { position: absolute; top: -12px; right: -5px; background: #ef4444; color: #fff; font-size: 10px; padding: 4px 10px; border-radius: 20px; font-weight: bold; box-shadow: 0 0 15px #ef4444; animation: pulseBadge 1.5s infinite alternate; z-index: 10; border: 1px solid #fff; font-family: 'Plus Jakarta Sans'; letter-spacing: 1px; }
        @keyframes pulseBadge { 0% { transform: scale(1); } 100% { transform: scale(1.15); } }

        .footer { text-align: center; padding: 20px; font-size: 12px; color: var(--text-muted); border-top: 1px solid rgba(255,255,255,0.06); }
        .owner-badge { color: var(--primary); font-family: 'Orbitron'; font-weight: 800; background: rgba(6,182,212,0.1); padding: 5px 10px; border-radius: 8px; }
    </style>
</head>
<body>

<header class="main-header">
    <div class="header-container">
        <div class="brand-box">
            <div class="brand-logo-wrap"><i class="fas fa-shield-cat" style="color:#fff;"></i></div>
            <div class="brand-title"><h1>PATEL CYBER</h1><span>NEXT GEN OSINT</span></div>
        </div>
    </div>
</header>

<div class="main-container">
    
    <!-- OSINT TRACKER CARD -->
    <div class="card animate-fade" style="animation-delay: 0.1s;">
        <form id="trackForm">
            <div class="form-group">
                <label style="font-size:12px; color:var(--text-muted); margin-bottom:10px; display:block;"><i class="fas fa-satellite-dish"></i> Target OSINT Scan</label>
                <div class="input-group">
                    <span style="padding:15px; color:var(--text-muted);">+91</span>
                    <input type="tel" id="phoneInput" placeholder="Enter Mobile Number" maxlength="10">
                </div>
            </div>
            <button type="submit" class="btn-action">EXECUTE SCAN</button>
        </form>
    </div>

    <!-- NEW REDESIGNED VIP SECTION (WITH FIXED BADGE) -->
    <div class="vip-section animate-fade" style="animation-delay: 0.3s;">
        <i class="fas fa-user-secret bg-icon"></i>
        <div class="vip-content">
            <h2 class="vip-title"><i class="fas fa-fingerprint"></i> AGENT LOGIN AREA</h2>
            <p class="vip-desc">Access to Public and VIP Private cyber tools. Authorized agents only.</p>
            
            <!-- Button wrapper to keep the badge outside the overflow limit -->
            <div class="btn-wrapper">
                <div class="badge-new">🔥 NEW</div>
                <a href="patel-login.html" class="btn-private-access">
                    <i class="fas fa-lock"></i> ACCESS PRIVATE CYBER TOOLS
                </a>
            </div>
        </div>
    </div>

</div>

<footer class="footer">
    © 2026 PATEL CYBER · SYSTEM BY <br><br>
    <span class="owner-badge">MR ANUJ PATEL</span> & <span class="owner-badge">MR SAGAR PATEL</span>
</footer>

<script>
document.getElementById('phoneInput').addEventListener('input', function() { this.value = this.value.replace(/[^0-9]/g, ''); });
document.getElementById('trackForm').onsubmit = (e) => {
    e.preventDefault();
    const number = document.getElementById('phoneInput').value;
    if(number.length === 10) { window.location.href = `result.html?num=${number}`; }
};
</script>
</body>
</html>
