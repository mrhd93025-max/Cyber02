<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patel Cyber Tools | Secure Intelligence</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&display=swap');
        :root { --cyber-cyan: #00f0ff; --cyber-blue: #0057ff; --dark-bg: #030712; --panel-bg: rgba(10, 15, 30, 0.8); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Rajdhani', sans-serif; }
        body { background-color: var(--dark-bg); color: #fff; min-height: 100vh; display: flex; flex-direction: column; background-image: radial-gradient(circle at 50% 50%, rgba(0, 87, 255, 0.1) 0%, transparent 60%), linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px); background-size: 100% 100%, 30px 30px, 30px 30px; }
        .gov-bar { background: linear-gradient(90deg, #0a0a0a, #1a1a1a, #0a0a0a); border-bottom: 2px solid #ff9933; padding: 10px 20px; display: flex; justify-content: space-between; font-weight: 600; font-size: 0.9rem; letter-spacing: 1px; color: #ff9933; text-transform: uppercase; box-shadow: 0 2px 15px rgba(255, 153, 51, 0.2); }
        .container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .cyber-card { background: var(--panel-bg); backdrop-filter: blur(20px); border: 1px solid rgba(0, 240, 255, 0.3); border-radius: 15px; padding: 50px; width: 100%; max-width: 550px; text-align: center; box-shadow: 0 0 30px rgba(0, 240, 255, 0.1); position: relative; overflow: hidden; }
        .logo-text { font-size: 2.8rem; font-weight: 700; background: linear-gradient(to right, #fff, var(--cyber-cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px; text-shadow: 0 0 20px rgba(0, 240, 255, 0.3); }
        .subtitle { color: #8ba3b8; font-size: 1.1rem; margin-bottom: 40px; letter-spacing: 2px; }
        .cyber-btn { display: block; width: 100%; padding: 16px; margin-bottom: 20px; background: linear-gradient(45deg, transparent 5%, var(--cyber-blue) 5%, var(--cyber-cyan) 100%); color: #000; font-size: 1.2rem; font-weight: 700; text-transform: uppercase; text-decoration: none; border-radius: 5px; transition: 0.4s; box-shadow: 0 0 15px rgba(0, 240, 255, 0.4); }
        .cyber-btn:hover { transform: scale(1.02); box-shadow: 0 0 30px rgba(0, 240, 255, 0.7); color: #fff; }
        .btn-outline { background: transparent; border: 1px solid var(--cyber-cyan); color: var(--cyber-cyan); box-shadow: none; }
        .btn-outline:hover { background: rgba(0, 240, 255, 0.1); color: #fff; box-shadow: 0 0 20px rgba(0, 240, 255, 0.3); }
    </style>
</head>
<body>
    <div class="gov-bar">
        <span>🇮🇳 भारत सरकार | Government of India</span>
        <span style="color: #00f0ff;">[ SECURE TERMINAL ]</span>
    </div>
    <div class="container">
        <div class="cyber-card">
            <h1 class="logo-text">PATEL CYBER TOOLS</h1>
            <p class="subtitle">INTELLIGENCE & LOOKUP NETWORK</p>
            <a href="patel-tools.html" class="cyber-btn">Initialize Lookup Engine</a>
            <a href="patel-login.html" class="cyber-btn btn-outline">Admin Control Panel</a>
        </div>
    </div>
</body>
</html>
