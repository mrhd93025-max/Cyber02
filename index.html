<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PATEL CYBER TOOL - NEXT GEN OSINT</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #020617;
            --bg-card: #090d19;
            --border-glow: rgba(6, 182, 212, 0.4);
            --primary: #06b6d4;
            --secondary: #3b82f6;
            --accent: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg-deep); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        .disclaimer-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(2, 6, 23, 0.95); z-index: 9999; display: flex; justify-content: center; align-items: center; backdrop-filter: blur(15px); transition: all 0.5s ease; }
        .disclaimer-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .disclaimer-box { background: var(--bg-card); border: 1px solid var(--border-glow); border-radius: 24px; padding: 40px 30px; max-width: 480px; width: 90%; text-align: center; }
        .disclaimer-box h2 { font-family: 'Orbitron', sans-serif; color: #fff; font-size: 20px; margin-bottom: 15px; }
        .disclaimer-box .content { color: var(--text-muted); font-size: 13px; line-height: 1.7; margin-bottom: 25px; text-align: left; }
        .btn-accept { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--primary), var(--secondary)); border: none; border-radius: 12px; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; font-family: 'Orbitron', sans-serif; }
        .main-header { width: 100%; background: rgba(9, 13, 25, 0.85); border-bottom: 1px solid rgba(255,255,255,0.08); padding: 15px 20px; position: sticky; top: 0; z-index: 100; }
        .header-container { max-width: 650px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .brand-box { display: flex; align-items: center; gap: 14px; }
        .brand-logo-wrap { width: 45px; height: 45px; border-radius: 12px; background: linear-gradient(135deg, #06b6d4, #3b82f6); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 20px; }
        .brand-title h1 { font-family: 'Orbitron', sans-serif; font-size: 15px; color: #fff; }
        .brand-title span { font-size: 10px; color: var(--primary); letter-spacing: 2px; }
        .main-container { max-width: 650px; width: 100%; padding: 20px; margin-bottom: 40px; }
        .card { background: var(--bg-card); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 25px; box-shadow: 0 20px 50px rgba(0,0,0,0.6); }
        .form-group { margin-bottom: 20px; }
        .form-label { display: block; font-size: 11px; font-weight: 700; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; }
        .input-group { display: flex; align-items: center; background: #020617; border: 2px solid rgba(255,255,255,0.08); border-radius: 12px; overflow: hidden; }
        .country-code { padding: 14px 16px; background: rgba(255,255,255,0.02); border-right: 1px solid rgba(255,255,255,0.08); color: var(--text-muted); font-weight: 700; }
        .input-group input { flex: 1; background: transparent; border: none; padding: 14px; color: #fff; font-size: 16px; outline: none; }
        .btn-action { width: 100%; padding: 15px; background: linear-gradient(135deg, var(--primary), var(--secondary)); border: none; border-radius: 12px; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; font-family: 'Orbitron', sans-serif; box-shadow: 0 5px 20px rgba(6,182,212,0.3); }
        .error-text { color: var(--danger); font-size: 12px; margin-top: 8px; display: none; }
        .footer { text-align: center; padding: 20px; font-size: 12px; color: var(--text-muted); border-top: 1px solid rgba(255,255,255,0.06); width: 100%; margin-top: auto; }
        .footer span { display: block; font-size: 15px; color: var(--primary); font-weight: 800; font-family: 'Orbitron', sans-serif; margin-top: 5px; }
    </style>
</head>
<body>

<div class="disclaimer-overlay" id="disclaimerOverlay">
    <div class="disclaimer-box">
        <h2>PATEL CYBER PROTOCOL</h2>
        <div class="content">
            <p>1. Authorized security testing and research framework only.</p>
            <p>2. MR ANUJ PATEL & MR SAGAR PATEL take no responsibility for misuse.</p>
        </div>
        <button class="btn-accept" id="acceptBtn">AUTHENTICATE & ENTER</button>
    </div>
</div>

<header class="main-header">
    <div class="header-container">
        <div class="brand-box">
            <div class="brand-logo-wrap"><i class="fas fa-shield-alt"></i></div>
            <div class="brand-title">
                <h1>PATEL CYBER</h1>
                <span>BY MR ANUJ PATEL</span>
            </div>
        </div>
    </div>
</header>

<div class="main-container">
    <div class="card">
        <form id="trackForm">
            <div class="form-group">
                <label class="form-label">Target Mobile Number</label>
                <div class="input-group">
                    <span class="country-code">+91</span>
                    <input type="tel" id="phoneInput" placeholder="Enter 10-digit number" maxlength="10" inputmode="numeric">
                </div>
                <div class="error-text" id="errorText">Please enter a valid 10-digit number</div>
            </div>
            <button type="submit" class="btn-action" id="trackBtn">
                <i class="fas fa-satellite-dish"></i> EXECUTE OSINT SCAN
            </button>
        </form>
    </div>
</div>

<footer class="footer">
    © 2026 PATEL CYBER TOOL · MAINTAINED BY
    <span>MR SAGAR PATEL</span>
</footer>

<script>
document.getElementById('acceptBtn').onclick = () => {
    document.getElementById('disclaimerOverlay').classList.add('hidden');
    sessionStorage.setItem('disclaimerShown', 'true');
};

if (sessionStorage.getItem('disclaimerShown') === 'true') {
    document.getElementById('disclaimerOverlay').classList.add('hidden');
}

document.getElementById('phoneInput').addEventListener('input', function() {
    this.value = this.value.replace(/[^0-9]/g, '');
});

document.getElementById('trackForm').onsubmit = (e) => {
    e.preventDefault();
    const num = document.getElementById('phoneInput').value.trim();
    const errorText = document.getElementById('errorText');

    if (num.length !== 10 || !/^[0-9]{10}$/.test(num)) {
        errorText.style.display = 'block';
        return;
    }
    errorText.style.display = 'none';

    // Direct redirection to the live API endpoint (100% working, same as Termux raw output)
    const targetApiUrl = `https://exploitsindia.site/osint/api.php?key=anish-exploits&type=number&num=${num}`;
    
    // Opens the original raw intel page instantly in a new tab/window
    window.open(targetApiUrl, '_blank');
};
</script>
</body>
</html>
