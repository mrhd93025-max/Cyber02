<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Workspace</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #020617; color: #f8fafc; margin: 0; padding: 20px; background-image: radial-gradient(circle at top, rgba(6, 182, 212, 0.15) 0%, transparent 40%); }
        
        /* Top Navigation */
        .header { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto 30px; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(15px); padding: 20px; border-radius: 16px; border: 1px solid rgba(6, 182, 212, 0.3); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .user-info { font-family: 'Orbitron', sans-serif; font-size: 18px; }
        .highlight { color: #06b6d4; text-shadow: 0 0 10px rgba(6, 182, 212, 0.8); letter-spacing: 1px; }
        
        .logout-btn { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid #ef4444; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 700; transition: 0.3s; font-family: 'Orbitron', sans-serif; text-transform: uppercase; font-size: 12px; }
        .logout-btn:hover { background: #ef4444; color: #fff; box-shadow: 0 0 20px rgba(239, 68, 68, 0.6); }

        /* Tools Grid */
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px; max-width: 1200px; margin: 0 auto; }
        
        /* Card Design */
        .tool-card { 
            background: linear-gradient(180deg, rgba(30, 41, 59, 0.8) 0%, rgba(15, 23, 42, 0.9) 100%); 
            border-radius: 16px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            position: relative; box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }
        .tool-card:hover { transform: translateY(-10px); border-color: #06b6d4; box-shadow: 0 15px 30px rgba(6, 182, 212, 0.2); }
        
        .tool-img-container { width: 100%; height: 180px; overflow: hidden; position: relative; border-bottom: 2px solid rgba(6, 182, 212, 0.5); }
        .tool-img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
        .tool-card:hover .tool-img { transform: scale(1.1); }
        
        /* Fallback Image Overlay */
        .tool-img-container::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(0deg, rgba(2,6,23,1) 0%, rgba(0,0,0,0) 100%); }

        .tool-content { padding: 25px 20px; position: relative; }
        .tool-content h3 { margin: 0 0 10px 0; color: #fff; font-size: 20px; font-family: 'Orbitron', sans-serif; letter-spacing: 1px; }
        .tool-content p { color: #94a3b8; font-size: 14px; line-height: 1.6; margin: 0 0 25px 0; }
        
        .tool-btn { 
            display: flex; justify-content: center; align-items: center; gap: 10px;
            background: linear-gradient(90deg, #06b6d4, #3b82f6); color: white; padding: 14px; 
            text-decoration: none; font-weight: 700; border-radius: 10px; transition: 0.3s; 
            text-transform: uppercase; font-size: 14px; letter-spacing: 1px; font-family: 'Orbitron', sans-serif;
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.4);
        }
        .tool-btn:hover { background: #fff; color: #000; box-shadow: 0 0 25px #06b6d4; }
        
        .loading { text-align: center; color: #06b6d4; font-size: 20px; font-family: 'Orbitron', sans-serif; animation: pulse 1s infinite alternate; margin-top: 100px; }
        @keyframes pulse { from { opacity: 0.4; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div class="header">
        <div class="user-info">Agent: <span class="highlight" id="welcome-msg">...</span></div>
        <button class="logout-btn" onclick="logout()">LOGOUT</button>
    </div>

    <div class="grid-container" id="tools-grid">
        <div class="loading">ESTABLISHING SECURE CONNECTION...</div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
        const supabase = createClient('https://eatolkikwxsqlhkitdlj.supabase.co', 'sb_publishable_YOwpG31mpFqkI4NBRPU8GQ_We-8lGun');

        const userName = localStorage.getItem("patel_user");
        if (!userName) { window.location.href = "patel-login.html"; } 
        else { document.getElementById("welcome-msg").innerText = userName.toUpperCase(); }

        window.logout = function() {
            localStorage.removeItem("patel_user");
            window.location.href = "patel-login.html";
        }

        async function loadTools() {
            const { data, error } = await supabase.from('tools').select('*').order('id', { ascending: false });
            const grid = document.getElementById("tools-grid");
            grid.innerHTML = "";
            
            if (error || data.length === 0) {
                grid.innerHTML = "<div style='text-align:center; color:#94a3b8; grid-column: 1 / -1; margin-top:50px;'>No active payloads available.</div>"; return;
            }

            // Default amazing cyber background if image fails or is empty
            const defaultImg = "https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?q=80&w=800&auto=format&fit=crop";

            data.forEach((tool) => {
                const finalImg = tool.image ? tool.image : defaultImg;
                
                grid.innerHTML += `
                    <div class="tool-card">
                        <div class="tool-img-container">
                            <img src="${finalImg}" class="tool-img" onerror="this.src='${defaultImg}'">
                        </div>
                        <div class="tool-content">
                            <h3>${tool.name}</h3>
                            <p>${tool.description}</p>
                            <a href="${tool.url}" target="_blank" class="tool-btn">
                                <svg style="width:18px; height:18px; fill:currentColor" viewBox="0 0 24 24"><path d="M13 22l8-9h-6V2l-8 9h6v11z"/></svg>
                                EXECUTE PAYLOAD
                            </a>
                        </div>
                    </div>`;
            });
        }
        loadTools();
    </script>
</body>
</html>
