<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search | Patel Cyber Tools</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap');
        body { margin:0; background: #030712; color: #fff; font-family: 'Rajdhani', sans-serif; display: flex; flex-direction: column; min-height: 100vh;}
        .gov-bar { background: #0a0a0a; border-bottom: 2px solid #ff9933; padding: 10px 20px; color: #ff9933; font-weight: bold; }
        .container { flex: 1; display: flex; justify-content: center; align-items: center; }
        .search-panel { background: rgba(10,15,30,0.8); border: 1px solid #00f0ff; padding: 50px; border-radius: 10px; width: 600px; text-align: center; box-shadow: 0 0 40px rgba(0,240,255,0.1); }
        .search-input { width: 100%; padding: 20px; background: #000; border: 2px solid rgba(0,240,255,0.3); color: #00f0ff; font-size: 1.5rem; text-align: center; margin-bottom: 20px; outline: none; border-radius: 8px;}
        .search-input:focus { border-color: #00f0ff; box-shadow: 0 0 20px rgba(0,240,255,0.4); }
        .scan-btn { width: 100%; padding: 20px; background: linear-gradient(90deg, #0057ff, #00f0ff); color: #000; font-size: 1.5rem; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .scan-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(0,240,255,0.5); color: #fff; }
    </style>
</head>
<body>
    <div class="gov-bar">🇮🇳 भारत सरकार | GOVERNMENT OF INDIA</div>
    <div class="container">
        <div class="search-panel">
            <h1 style="color:#fff; text-shadow: 0 0 10px #00f0ff; margin-bottom: 10px;">INTELLIGENCE SCANNER</h1>
            <p style="color:#8ba3b8; margin-bottom: 30px;">Enter Target Mobile Number / ID to Fetch Details</p>
            
            <form onsubmit="handleScan(event)">
                <input type="text" id="queryInput" class="search-input" placeholder="Enter Number..." required autocomplete="off">
                <button type="submit" class="scan-btn">Initiate Deep Scan</button>
            </form>
        </div>
    </div>

    <script>
        function handleScan(e) {
            e.preventDefault();
            let query = document.getElementById('queryInput').value;
            
            // Save log for Admin Panel
            let logs = JSON.parse(localStorage.getItem('patel_logs') || '[]');
            logs.push({ query: query, time: new Date().toLocaleString() });
            localStorage.setItem('patel_logs', JSON.stringify(logs));

            // Redirect to result page
            window.location.href = `result.html?query=${encodeURIComponent(query)}`;
        }
    </script>
</body>
</html>
