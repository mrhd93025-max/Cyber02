<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Patel Cyber Workspace</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #020617; color: #f8fafc; margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* TOP HEADER */
        .header { display: flex; justify-content: space-between; align-items: center; background: rgba(9, 13, 25, 0.95); padding: 15px 20px; border-bottom: 1px solid rgba(6, 182, 212, 0.2); z-index: 100; }
        .brand { font-family: 'Orbitron'; font-size: 18px; font-weight: 900; color: #fff; display: flex; align-items: center; gap: 8px; }
        .brand i { color: #06b6d4; text-shadow: 0 0 10px #06b6d4; }
        .logout-btn { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid #ef4444; padding: 6px 15px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 12px; }

        /* CONTENT AREA (NO SCROLL ON BODY, ONLY HERE) */
        .app-content { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 90px; }
        .page-section { display: none; animation: slideUp 0.4s ease; }
        .page-section.active { display: block; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .section-title { color: #06b6d4; font-family: 'Orbitron'; margin-bottom: 20px; font-size: 16px; border-left: 3px solid #06b6d4; padding-left: 10px; }
        .section-title.vip { color: #f59e0b; border-left-color: #f59e0b; text-shadow: 0 0 10px rgba(245, 158, 11, 0.3); }

        /* TOOL GRIDS */
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; }
        .tool-card { background: rgba(15, 23, 42, 0.8); border-radius: 16px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); position: relative; display: flex; flex-direction: column; }
        .tool-img-container { width: 100%; height: 100px; position: relative; }
        .tool-img { width: 100%; height: 100%; object-fit: cover; opacity: 0.8; }
        
        /* VIP PREMIUM BADGE */
        .vip-badge { position: absolute; top: 5px; right: 5px; background: linear-gradient(45deg, #f59e0b, #fbbf24); color: #000; font-size: 10px; font-weight: 900; padding: 3px 8px; border-radius: 10px; font-family: 'Orbitron'; box-shadow: 0 0 10px #f59e0b; z-index: 10; }
        
        .tool-content { padding: 12px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .tool-content h3 { margin: 0 0 5px 0; color: #fff; font-size: 13px; font-family: 'Orbitron'; }
        .tool-content p { color: #94a3b8; font-size: 10px; margin: 0 0 10px 0; line-height: 1.4; height: 28px; overflow: hidden; }
        
        .tool-btn { display: block; text-align: center; background: rgba(6, 182, 212, 0.1); color: #06b6d4; padding: 8px; text-decoration: none; font-weight: 700; border-radius: 8px; font-size: 11px; border: 1px solid #06b6d4; }
        .tool-btn.vip-btn { background: rgba(245, 158, 11, 0.1); color: #f59e0b; border-color: #f59e0b; }

        /* APP BOTTOM NAVIGATION */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(9, 13, 25, 0.95); backdrop-filter: blur(15px); border-top: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-around; padding: 10px 0 15px 0; z-index: 100; }
        .nav-item { background: none; border: none; color: #64748b; font-size: 10px; font-family: 'Orbitron'; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer; transition: 0.3s; width: 30%; }
        .nav-item i { font-size: 20px; }
        .nav-item.active { color: #06b6d4; }
        .nav-item.active i { text-shadow: 0 0 15px #06b6d4; transform: scale(1.1); }
        .nav-item.vip-nav.active { color: #f59e0b; }
        .nav-item.vip-nav.active i { text-shadow: 0 0 15px #f59e0b; }

        /* SOCIAL TAB */
        .insta-card { background: linear-gradient(45deg, #1e293b, #0f172a); padding: 20px; border-radius: 20px; text-align: center; margin-bottom: 15px; border: 1px solid #334155; }
        .insta-btn { display: inline-flex; align-items: center; gap: 10px; background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); padding: 12px 25px; border-radius: 30px; color: white; text-decoration: none; font-weight: bold; font-size: 14px; margin-top: 10px; }
    </style>
</head>
<body>

    <!-- TOP HEADER -->
    <div class="header">
        <div class="brand"><i class="fas fa-shield-cat"></i> PATEL OS</div>
        <button class="logout-btn" onclick="logout()"><i class="fas fa-power-off"></i> EXIT</button>
    </div>

    <!-- MAIN SCROLLABLE CONTENT -->
    <div class="app-content">
        
        <!-- PAGE 1: PUBLIC TOOLS -->
        <div id="page-public" class="page-section active">
            <h2 class="section-title">🌐 PUBLIC ARSENAL</h2>
            <div class="grid-container" id="grid-public">
                <div style="color:#94a3b8; font-size:12px;">Loading tools...</div>
            </div>
        </div>

        <!-- PAGE 2: VIP PRIVATE TOOLS -->
        <div id="page-vip" class="page-section">
            <h2 class="section-title vip">🔐 VIP EXCLUSIVE TOOLS</h2>
            <p style="color:#94a3b8; font-size:11px; margin-bottom:15px; margin-top:-10px;">Premium tools strictly authorized for Advanced Agents.</p>
            <div class="grid-container" id="grid-vip">
                <!-- VIP tools injected here -->
            </div>
        </div>

        <!-- PAGE 3: CREATORS (INSTAGRAM) -->
        <div id="page-social" class="page-section">
            <h2 class="section-title" style="border-color:#ec4899; color:#ec4899;">📱 SYSTEM CREATORS</h2>
            
            <div class="insta-card">
                <h3 style="color:#fff; font-family:'Orbitron'; margin-bottom:5px;">MR. ANUJ PATEL</h3>
                <p style="color:#94a3b8; font-size:12px;">Lead Developer & Security Architect</p>
                <a href="https://www.instagram.com/_.official_anuj?igsh=MWE4cTd6amxrcjl0cQ==" target="_blank" class="insta-btn"><i class="fab fa-instagram"></i> Follow on Instagram</a>
            </div>

            <div class="insta-card">
                <h3 style="color:#fff; font-family:'Orbitron'; margin-bottom:5px;">MR. SAGAR PATEL</h3>
                <p style="color:#94a3b8; font-size:12px;">Co-Founder & UI/UX Director</p>
                <a href="https://www.instagram.com/itz_sagar_0zx?igsh=YWoyc20xdHJhMzk1" target="_blank" class="insta-btn"><i class="fab fa-instagram"></i> Follow on Instagram</a>
            </div>
        </div>
    </div>

    <!-- BOTTOM APP NAVIGATION -->
    <div class="bottom-nav">
        <button class="nav-item active" onclick="switchAppTab('page-public')">
            <i class="fas fa-globe"></i> <span>PUBLIC</span>
        </button>
        <button class="nav-item vip-nav" onclick="switchAppTab('page-vip')">
            <i class="fas fa-gem"></i> <span>VIP TOOLS</span>
        </button>
        <button class="nav-item" onclick="switchAppTab('page-social')" style="color:#64748b;">
            <i class="fab fa-instagram"></i> <span>CREATORS</span>
        </button>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
        const supabase = createClient('https://eatolkikwxsqlhkitdlj.supabase.co', 'sb_publishable_YOwpG31mpFqkI4NBRPU8GQ_We-8lGun');

        // Security Check
        const userName = localStorage.getItem("patel_user");
        if (!userName) { window.location.href = "patel-login.html"; }

        window.logout = function() { localStorage.removeItem("patel_user"); window.location.href = "patel-login.html"; }

        // Bottom Tab Switcher Logic
        window.switchAppTab = function(pageId) {
            document.querySelectorAll('.page-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        async function loadAppTools() {
            const { data, error } = await supabase.from('tools').select('*').order('id', { ascending: false });
            const gridPublic = document.getElementById("grid-public");
            const gridVip = document.getElementById("grid-vip");
            gridPublic.innerHTML = ""; gridVip.innerHTML = "";
            
            if (error || data.length === 0) {
                gridPublic.innerHTML = "<div style='color:#ef4444; font-size:12px;'>No tools available. Admin needs to upload.</div>"; return;
            }

            let publicCount = 0; let vipCount = 0;
            const defaultImg = "https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?q=80&w=800";

            data.forEach((tool) => {
                const finalImg = tool.image || defaultImg;
                
                // HACK: Check if tool is VIP based on Admin Panel tag
                let isVip = tool.description && tool.description.includes("[VIP]");
                let cleanDesc = tool.description ? tool.description.replace("[VIP] ", "") : "";

                if(isVip) {
                    vipCount++;
                    gridVip.innerHTML += `
                    <div class="tool-card" style="border-color: rgba(245, 158, 11, 0.3);">
                        <div class="vip-badge"><i class="fas fa-crown"></i> VIP</div>
                        <div class="tool-img-container"><img src="${finalImg}" class="tool-img"></div>
                        <div class="tool-content">
                            <h3>${tool.name}</h3>
                            <p>${cleanDesc}</p>
                            <a href="${tool.url}" target="_blank" class="tool-btn vip-btn"><i class="fas fa-lock-open"></i> ACCESS</a>
                        </div>
                    </div>`;
                } else {
                    publicCount++;
                    gridPublic.innerHTML += `
                    <div class="tool-card">
                        <div class="tool-img-container"><img src="${finalImg}" class="tool-img"></div>
                        <div class="tool-content">
                            <h3>${tool.name}</h3>
                            <p>${cleanDesc}</p>
                            <a href="${tool.url}" target="_blank" class="tool-btn"><i class="fas fa-play"></i> LAUNCH</a>
                        </div>
                    </div>`;
                }
            });

            if(publicCount === 0) gridPublic.innerHTML = "<div style='color:#94a3b8; font-size:12px;'>No public tools found.</div>";
            if(vipCount === 0) gridVip.innerHTML = "<div style='color:#94a3b8; font-size:12px;'>No VIP tools uploaded yet.</div>";
        }
        
        loadAppTools();
    </script>
</body>
</html>
