<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patel Cyber - Workspace</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #020617; color: #f8fafc; margin: 0; padding: 20px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; max-width: 1100px; margin: auto; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(10px); padding: 15px 30px; border-radius: 12px; border: 1px solid rgba(56,189,248,0.3); box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        h2 { margin: 0; color: #e0f2fe; }
        .highlight { color: #38bdf8; text-shadow: 0 0 8px rgba(56,189,248,0.5); }
        
        .logout-btn { background: transparent; color: #f43f5e; border: 1px solid #f43f5e; padding: 8px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .logout-btn:hover { background: #f43f5e; color: #fff; box-shadow: 0 0 10px #f43f5e; }

        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 25px; max-width: 1100px; margin: 40px auto; }
        
        .tool-card { background: rgba(30, 41, 59, 0.5); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid #334155; transition: 0.4s; backdrop-filter: blur(5px); }
        .tool-card:hover { transform: translateY(-8px); border-color: #38bdf8; box-shadow: 0 10px 20px rgba(56, 189, 248, 0.2); }
        
        .tool-img { width: 100%; height: 160px; object-fit: cover; border-bottom: 1px solid #334155; }
        .tool-content { padding: 20px; }
        .tool-content h3 { margin: 0 0 10px 0; color: #38bdf8; font-size: 20px; }
        .tool-content p { color: #94a3b8; font-size: 14px; line-height: 1.5; margin: 0; }
        
        .tool-btn { display: block; text-align: center; background: #0284c7; color: white; padding: 12px; text-decoration: none; font-weight: bold; margin: 0 20px 20px 20px; border-radius: 8px; transition: 0.3s; text-transform: uppercase; font-size: 14px; letter-spacing: 1px; }
        .tool-btn:hover { background: #38bdf8; box-shadow: 0 0 15px rgba(56, 189, 248, 0.6); }
        
        .loading { text-align: center; color: #38bdf8; font-size: 18px; margin-top: 50px; font-family: 'Courier New', Courier, monospace; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
    </style>
</head>
<body>

    <div class="header">
        <h2>Active User: <span class="highlight" id="welcome-msg">Guest</span></h2>
        <button class="logout-btn" onclick="logout()">DISCONNECT</button>
    </div>

    <div class="grid-container" id="tools-grid">
        <div class="loading">Loading Secure Workspace...</div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
        const supabase = createClient('https://eatolkikwxsqlhkitdlj.supabase.co', 'sb_publishable_YOwpG31mpFqkI4NBRPU8GQ_We-8lGun');

        const userName = localStorage.getItem("patel_user");
        if (!userName) { window.location.href = "patel-login.html"; } 
        else { document.getElementById("welcome-msg").innerText = userName.toUpperCase(); }

        window.logout = function() {
            localStorage.removeItem("patel_user");
            window.location.href = "patel-login.html";
        }

        async function loadTools() {
            const { data, error } = await supabase.from('tools').select('*').order('id', { ascending: false });
            const grid = document.getElementById("tools-grid");
            grid.innerHTML = "";
            
            if (error || data.length === 0) {
                grid.innerHTML = "<p style='text-align:center; color:#94a3b8; grid-column: 1 / -1;'>No active tools found in the database.</p>"; return;
            }

            data.forEach((tool) => {
                grid.innerHTML += `
                    <div class="tool-card">
                        <div>
                            <img src="${tool.image}" class="tool-img">
                            <div class="tool-content">
                                <h3>${tool.name}</h3>
                                <p>${tool.description}</p>
                            </div>
                        </div>
                        <a href="${tool.url}" target="_blank" class="tool-btn">Execute Tool</a>
                    </div>`;
            });
        }
        loadTools();
    </script>
</body>
</html>
