<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Cyber Workspace</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #020617; color: #f8fafc; margin: 0; padding: 0; min-height: 100vh; display: flex; flex-direction: column; 
        background-image: 
            linear-gradient(rgba(6, 182, 212, 0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(6, 182, 212, 0.03) 1px, transparent 1px); background-size: 40px 40px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; background: rgba(2, 6, 23, 0.9); backdrop-filter: blur(20px); padding: 20px 40px; border-bottom: 2px solid rgba(6, 182, 212, 0.2); box-shadow: 0 5px 30px rgba(0,0,0,0.8); position: sticky; top: 0; z-index: 100; }
        .brand { font-family: 'Orbitron', sans-serif; font-size: 24px; font-weight: 900; color: #fff; display: flex; align-items: center; gap: 10px; }
        .brand i { color: #06b6d4; text-shadow: 0 0 15px #06b6d4; }
        .user-info { font-family: 'Orbitron', sans-serif; font-size: 14px; background: rgba(6, 182, 212, 0.1); padding: 8px 20px; border-radius: 20px; border: 1px solid #06b6d4; color: #06b6d4; }
        .logout-btn { background: transparent; color: #ef4444; border: 2px solid #ef4444; padding: 8px 25px; border-radius: 8px; cursor: pointer; font-weight: 700; transition: 0.3s; font-family: 'Orbitron', sans-serif; }
        .logout-btn:hover { background: #ef4444; color: #fff; box-shadow: 0 0 20px rgba(239, 68, 68, 0.6); }

        .container { flex: 1; padding: 40px 20px; max-width: 1300px; margin: 0 auto; width: 100%; box-sizing: border-box; }
        
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 35px; }
        
        .tool-card { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(10px); border-radius: 20px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); position: relative; box-shadow: 0 15px 35px rgba(0,0,0,0.5); transition: 0.4s; }
        .tool-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: #06b6d4; box-shadow: 0 0 15px #06b6d4; z-index: 10; opacity: 0; transition: 0.4s; }
        .tool-card:hover { transform: translateY(-10px); border-color: rgba(6, 182, 212, 0.4); }
        .tool-card:hover::before { opacity: 1; }
        
        .tool-img-container { width: 100%; height: 180px; position: relative; }
        .tool-img { width: 100%; height: 100%; object-fit: cover; opacity: 0.8; transition: 0.5s; }
        .tool-card:hover .tool-img { opacity: 1; transform: scale(1.05); }
        .tool-img-container::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 50%; background: linear-gradient(0deg, rgba(15,23,42,1) 0%, rgba(0,0,0,0) 100%); }

        .tool-content { padding: 25px; }
        .tool-content h3 { margin: 0 0 10px 0; color: #fff; font-size: 22px; font-family: 'Orbitron', sans-serif; }
        .tool-content p { color: #94a3b8; font-size: 14px; line-height: 1.6; margin: 0 0 25px 0; height: 45px; overflow: hidden; }
        
        .tool-btn { display: flex; justify-content: center; align-items: center; gap: 10px; background: rgba(6, 182, 212, 0.1); color: #06b6d4; padding: 15px; text-decoration: none; font-weight: 700; border-radius: 12px; transition: 0.3s; text-transform: uppercase; font-size: 14px; letter-spacing: 2px; font-family: 'Orbitron', sans-serif; border: 1px solid #06b6d4; }
        .tool-btn:hover { background: #06b6d4; color: #000; box-shadow: 0 0 20px rgba(6, 182, 212, 0.6); }

        /* Social Footer Section */
        .social-footer { background: rgba(9, 13, 25, 0.9); border-top: 1px solid rgba(6, 182, 212, 0.2); padding: 40px 20px; text-align: center; margin-top: 50px; }
        .social-footer h4 { color: #fff; font-family: 'Orbitron', sans-serif; letter-spacing: 3px; margin-bottom: 25px; font-size: 18px; text-shadow: 0 0 10px rgba(6,182,212,0.5); }
        .insta-links { display: flex; justify-content: center; gap: 30px; flex-wrap: wrap; }
        .insta-btn { display: flex; align-items: center; gap: 10px; background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); padding: 12px 25px; border-radius: 30px; color: white; text-decoration: none; font-weight: bold; font-size: 16px; box-shadow: 0 10px 20px rgba(220, 39, 67, 0.3); transition: 0.3s; }
        .insta-btn:hover { transform: translateY(-5px) scale(1.05); box-shadow: 0 15px 25px rgba(220, 39, 67, 0.5); }
        .insta-btn i { font-size: 20px; }
        
        .loading { text-align: center; color: #06b6d4; font-size: 22px; font-family: 'Orbitron', sans-serif; animation: pulse 1s infinite alternate; margin-top: 100px; }
        @keyframes pulse { from { opacity: 0.3; } to { opacity: 1; text-shadow: 0 0 20px #06b6d4; } }
    </style>
</head>
<body>

    <div class="header">
        <div class="brand"><i class="fas fa-shield-cat"></i> PATEL CYBER</div>
        <div style="display:flex; gap:20px; align-items:center;">
            <div class="user-info"><i class="fas fa-user-secret"></i> AGENT: <span id="welcome-msg" style="color:#fff; font-weight:bold;">...</span></div>
            <button class="logout-btn" onclick="logout()">LOGOUT</button>
        </div>
    </div>

    <div class="container">
        <div class="grid-container" id="tools-grid">
            <div class="loading">DECRYPTING PAYLOADS... PLEASE WAIT.</div>
        </div>
    </div>

    <!-- INSTAGRAM SOCIAL FOOTER -->
    <div class="social-footer">
        <h4>SYSTEM DEVELOPED & MAINTAINED BY</h4>
        <div class="insta-links">
            <a href="https://www.instagram.com/_.official_anuj?igsh=MWE4cTd6amxrcjl0cQ==" target="_blank" class="insta-btn">
                <i class="fab fa-instagram"></i> ANUJ PATEL
            </a>
            <a href="https://www.instagram.com/itz_sagar_0zx?igsh=YWoyc20xdHJhMzk1" target="_blank" class="insta-btn">
                <i class="fab fa-instagram"></i> SAGAR PATEL
            </a>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
        const supabase = createClient('https://eatolkikwxsqlhkitdlj.supabase.co', 'sb_publishable_YOwpG31mpFqkI4NBRPU8GQ_We-8lGun');

        const userName = localStorage.getItem("patel_user");
        if (!userName) { window.location.href = "patel-login.html"; } 
        else { document.getElementById("welcome-msg").innerText = userName.toUpperCase(); }

        window.logout = function() {
            localStorage.removeItem("patel_user");
            window.location.href = "patel-login.html";
        }

        async function loadTools() {
            const { data, error } = await supabase.from('tools').select('*').order('id', { ascending: false });
            const grid = document.getElementById("tools-grid");
            grid.innerHTML = "";
            
            if (error || data.length === 0) {
                grid.innerHTML = "<div style='text-align:center; color:#94a3b8; grid-column: 1 / -1; margin-top:50px;'>No active tools available in database.</div>"; return;
            }

            // Fallback fail-safe image
            const defaultImg = "https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?q=80&w=800&auto=format&fit=crop";

            data.forEach((tool) => {
                const finalImg = tool.image ? tool.image : defaultImg;
                
                grid.innerHTML += `
                    <div class="tool-card">
                        <div class="tool-img-container">
                            <img src="${finalImg}" class="tool-img" onerror="this.src='${defaultImg}'">
                        </div>
                        <div class="tool-content">
                            <h3>${tool.name}</h3>
                            <p>${tool.description}</p>
                            <a href="${tool.url}" target="_blank" class="tool-btn">
                                <i class="fas fa-terminal"></i> LAUNCH TOOL
                            </a>
                        </div>
                    </div>`;
            });
        }
        loadTools();
    </script>
</body>
</html>
