<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PATEL CYBER - INTEL RESULT</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #020617;
            --bg-card: #090d19;
            --border-glow: rgba(6, 182, 212, 0.4);
            --primary: #06b6d4;
            --secondary: #3b82f6;
            --accent: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body {
            background: var(--bg-deep); color: var(--text-main); min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(6, 182, 212, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(59, 130, 246, 0.12) 0%, transparent 40%);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-fade { animation: fadeIn 0.4s ease forwards; }

        .main-header {
            width: 100%; background: rgba(9, 13, 25, 0.85); backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255,255,255,0.08); padding: 15px 20px;
            position: sticky; top: 0; z-index: 100;
        }
        .header-container { max-width: 650px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .brand-box { display: flex; align-items: center; gap: 14px; }
        .brand-logo-wrap {
            width: 45px; height: 45px; border-radius: 12px;
            background: linear-gradient(135deg, #06b6d4, #3b82f6);
            display: flex; align-items: center; justify-content: center; color: #fff; font-size: 20px;
            box-shadow: 0 0 20px rgba(6,182,212,0.4);
        }
        .brand-title h1 { font-family: 'Orbitron', sans-serif; font-size: 15px; color: #fff; }
        .brand-title span { font-size: 10px; color: var(--primary); letter-spacing: 2px; }

        .main-container { max-width: 650px; width: 100%; padding: 20px; margin-bottom: 40px; }
        
        .card {
            background: var(--bg-card); border: 1px solid var(--border-glow);
            border-radius: 22px; overflow: hidden; box-shadow: 0 25px 60px rgba(0,0,0,0.7);
            position: relative;
        }
        .card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
        }
        
        .result-header {
            padding: 16px 20px; background: rgba(6,182,212,0.1);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            display: flex; justify-content: space-between; align-items: center;
            font-size: 12px; font-weight: 700; color: var(--primary); font-family: 'Orbitron', sans-serif;
        }
        
        .result-body { padding: 20px; }
        
        /* Clean structured formatted lines box */
        .formatted-box {
            background: #020617; border: 1px solid rgba(6,182,212,0.3);
            border-radius: 14px; padding: 18px; color: #f8fafc;
            font-size: 14px; line-height: 1.8; text-align: left;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
            display: flex; flex-direction: column; gap: 10px;
        }

        .info-item {
            display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.06);
            padding-bottom: 8px; word-break: break-word;
        }
        .info-item:last-child { border-bottom: none; }
        .info-label { color: var(--text-muted); font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .info-val { color: var(--primary); font-weight: 700; text-align: right; }

        .loading-box { text-align: center; padding: 30px; color: var(--primary); font-family: 'Orbitron', sans-serif; font-size: 13px; }
        .loading-box i { font-size: 30px; margin-bottom: 12px; display: block; text-shadow: 0 0 15px var(--primary); }

        .btn-action {
            width: 100%; padding: 14px; margin-top: 15px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none; border-radius: 12px; color: #fff; font-size: 14px; font-weight: 700;
            cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px;
            font-family: 'Orbitron', sans-serif; letter-spacing: 1px; text-decoration: none;
            box-shadow: 0 5px 20px rgba(6,182,212,0.3);
        }

        .btn-back {
            display: inline-flex; align-items: center; gap: 8px; margin-top: 25px; padding: 12px 24px;
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px; color: #fff; text-decoration: none; font-size: 13px; font-weight: 700; transition: 0.3s;
        }
        .btn-back:hover { background: rgba(255,255,255,0.08); border-color: var(--primary); }

        .footer { text-align: center; padding: 25px 20px; font-size: 12px; color: var(--text-muted); border-top: 1px solid rgba(255,255,255,0.06); width: 100%; margin-top: auto; letter-spacing: 1px; }
        .owners-box { display: flex; justify-content: center; align-items: center; gap: 12px; margin-top: 10px; }
        .owner-badge {
            font-family: 'Orbitron', sans-serif; font-size: 13px; font-weight: 800; color: var(--primary);
            text-shadow: 0 0 10px rgba(6,182,212,0.5); background: rgba(6,182,212,0.08);
            padding: 7px 16px; border-radius: 12px; border: 1px solid rgba(6,182,212,0.35);
        }
    </style>
</head>
<body>

<header class="main-header">
    <div class="header-container">
        <div class="brand-box">
            <div class="brand-logo-wrap"><i class="fas fa-shield-alt"></i></div>
            <div class="brand-title">
                <h1>PATEL CYBER</h1>
                <span>INTEL DECODER</span>
            </div>
        </div>
    </div>
</header>

<div class="main-container animate-fade">
    <div class="card">
        <div class="result-header">
            <span><i class="fas fa-database"></i> STRUCTURED INTEL RECORD</span>
            <span id="targetDisplayNum">--</span>
        </div>
        <div class="result-body">
            <div class="loading-box" id="loadingBox">
                <i class="fas fa-spinner fa-spin"></i>
                FORMATTING TELEMETRY NODES...
            </div>

            <div id="contentArea" style="display:none;">
                <div class="formatted-box" id="formattedBoxContent">
                    <!-- Parsed structured data will appear here cleanly divided -->
                </div>
                <a id="directLinkBtn" href="#" target="_blank" class="btn-action" style="margin-top:15px;">
                    <i class="fas fa-external-link-alt"></i> OPEN RAW JSON FEED
                </a>
            </div>
        </div>
    </div>
    
    <div style="text-align: center;">
        <a href="index.html" class="btn-back"><i class="fas fa-arrow-left"></i> Perform Another Scan</a>
    </div>
</div>

<footer class="footer">
    © 2026 PATEL CYBER TOOL · MAINTAINED & DEVELOPED BY
    <div class="owners-box">
        <span class="owner-badge">MR ANUJ PATEL</span>
        <span style="color:var(--text-muted); font-weight:700;">&</span>
        <span class="owner-badge">MR SAGAR PATEL</span>
    </div>
</footer>

<script>
async function loadStructuredData() {
    const urlParams = new URLSearchParams(window.location.search);
    const num = urlParams.get('num');
    const loadingBox = document.getElementById('loadingBox');
    const contentArea = document.getElementById('contentArea');
    const formattedBoxContent = document.getElementById('formattedBoxContent');
    const targetDisplay = document.getElementById('targetDisplayNum');
    const directLinkBtn = document.getElementById('directLinkBtn');

    if (!num || num.length !== 10) {
        loadingBox.innerHTML = `<span style="color:var(--danger);">Invalid or missing target number.</span>`;
        return;
    }

    targetDisplay.textContent = `+91 ${num}`;
    const targetApiUrl = `https://exploitsindia.site/osint/api.php?key=anish-exploits&type=number&num=${num}`;
    directLinkBtn.href = targetApiUrl;

    try {
        const proxyUrl = `https://api.allorigins.win/raw?url=` + encodeURIComponent(targetApiUrl);
        const response = await fetch(proxyUrl);
        const textData = await response.text();

        loadingBox.style.display = 'none';

        // Try parsing JSON to cleanly split items line by line
        try {
            const jsonData = JSON.parse(textData);
            if(jsonData.result && jsonData.result.length > 0) {
                let info = jsonData.result[0];
                let htmlOutput = '';
                for (let key in info) {
                    htmlOutput += `
                        <div class="info-item">
                            <span class="info-label"><i class="fas fa-angle-right"></i> ${key.toUpperCase()}</span>
                            <span class="info-val">${info[key]}</span>
                        </div>
                    `;
                }
                formattedBoxContent.innerHTML = htmlOutput;
            } else {
                formattedBoxContent.innerHTML = `<div style="color:var(--danger);">No records found in database for this number.</div>`;
            }
        } catch(parseErr) {
            // If it's pure raw text, split it nicely by commas or newlines so it never stays in one single line
            let cleanText = textData.replace(/[{}[\]"]/g, '').split(',').join('<br><br>');
            formattedBoxContent.innerHTML = `<div style="line-height: 1.8; color:#38bdf8;">${cleanText}</div>`;
        }

        contentArea.style.display = 'block';
        contentArea.classList.add('animate-fade');
    } catch (err) {
        loadingBox.style.display = 'none';
        formattedBoxContent.innerHTML = `<span style="color:var(--danger);">Connection error. Please use the button below to view raw feed.</span>`;
        contentArea.style.display = 'block';
    }
}

loadStructuredData();
</script>
</body>
</html>
