<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PATEL CYBER - INTEL RESULT</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #020617;
            --bg-card: #090d19;
            --border-glow: rgba(6, 182, 212, 0.4);
            --primary: #06b6d4;
            --secondary: #3b82f6;
            --accent: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body {
            background: var(--bg-deep); color: var(--text-main); min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            background-image: radial-gradient(circle at 10% 10%, rgba(6, 182, 212, 0.12) 0%, transparent 40%);
        }

        .main-header {
            width: 100%; background: rgba(9, 13, 25, 0.85); backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255,255,255,0.08); padding: 15px 20px;
            position: sticky; top: 0; z-index: 100;
        }
        .header-container { max-width: 650px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .brand-box { display: flex; align-items: center; gap: 14px; }
        .brand-logo-wrap {
            width: 45px; height: 45px; border-radius: 12px;
            background: linear-gradient(135deg, #06b6d4, #3b82f6);
            display: flex; align-items: center; justify-content: center; color: #fff; font-size: 20px;
            box-shadow: 0 0 20px rgba(6,182,212,0.4);
        }
        .brand-title h1 { font-family: 'Orbitron', sans-serif; font-size: 15px; color: #fff; }
        .brand-title span { font-size: 10px; color: var(--primary); letter-spacing: 2px; }

        .main-container { max-width: 650px; width: 100%; padding: 20px; margin-bottom: 40px; }
        
        .card {
            background: var(--bg-card); border: 1px solid var(--border-glow);
            border-radius: 22px; overflow: hidden; box-shadow: 0 25px 60px rgba(0,0,0,0.7);
        }
        .result-header {
            padding: 16px 20px; background: rgba(6,182,212,0.1);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            display: flex; justify-content: space-between; align-items: center;
            font-size: 12px; font-weight: 700; color: var(--primary); font-family: 'Orbitron', sans-serif;
        }
        
        .result-body { padding: 25px; text-align: center; }
        
        .loading-box { padding: 20px; color: var(--primary); font-family: 'Orbitron', sans-serif; font-size: 13px; }
        .loading-box i { font-size: 30px; margin-bottom: 12px; display: block; }

        .btn-action {
            display: inline-flex; align-items: center; justify-content: center; gap: 10px;
            width: 100%; padding: 16px; margin-top: 10px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none; border-radius: 14px; color: #fff; font-size: 14px; font-weight: 700;
            font-family: 'Orbitron', sans-serif; text-decoration: none;
            box-shadow: 0 5px 20px rgba(6,182,212,0.3); transition: 0.3s;
        }
        .btn-action:hover { transform: translateY(-2px); box-shadow: 0 0 25px rgba(6,182,212,0.5); }

        .btn-back {
            display: inline-flex; align-items: center; gap: 8px; margin-top: 25px; padding: 12px 24px;
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px; color: #fff; text-decoration: none; font-size: 13px; font-weight: 700;
        }

        .footer { text-align: center; padding: 25px 20px; font-size: 12px; color: var(--text-muted); border-top: 1px solid rgba(255,255,255,0.06); width: 100%; margin-top: auto; }
        .owners-box { display: flex; justify-content: center; align-items: center; gap: 12px; margin-top: 10px; }
        .owner-badge {
            font-family: 'Orbitron', sans-serif; font-size: 13px; font-weight: 800; color: var(--primary);
            text-shadow: 0 0 10px rgba(6,182,212,0.5); background: rgba(6,182,212,0.08);
            padding: 7px 16px; border-radius: 12px; border: 1px solid rgba(6,182,212,0.35);
        }
    </style>
</head>
<body>

<header class="main-header">
    <div class="header-container">
        <div class="brand-box">
            <div class="brand-logo-wrap"><i class="fas fa-shield-alt"></i></div>
            <div class="brand-title">
                <h1>PATEL CYBER</h1>
                <span>INTEL DECODER</span>
            </div>
        </div>
    </div>
</header>

<div class="main-container">
    <div class="card">
        <div class="result-header">
            <span><i class="fas fa-database"></i> SECURED INTEL RECORD</span>
            <span id="targetDisplayNum">--</span>
        </div>
        <div class="result-body">
            <div class="loading-box" id="loadingBox">
                <i class="fas fa-spinner fa-spin"></i>
                DECRYPTING DATABASE NODE...
            </div>
            <div id="actionArea" style="display:none;">
                <p style="color: var(--text-muted); font-size: 13px; margin-bottom: 15px;">Target telemetry and registry record successfully extracted.</p>
                <a id="secureLink" href="#" target="_blank" class="btn-action">
                    <i class="fas fa-id-card"></i> OPEN DETAILS & RECORD FEED
                </a>
            </div>
        </div>
    </div>
    
    <div style="text-align: center;">
        <a href="index.html" class="btn-back"><i class="fas fa-arrow-left"></i> Perform Another Scan</a>
    </div>
</div>

<footer class="footer">
    © 2026 PATEL CYBER TOOL · MAINTAINED & DEVELOPED BY
    <div class="owners-box">
        <span class="owner-badge">MR ANUJ PATEL</span>
        <span style="color:var(--text-muted); font-weight:700;">&</span>
        <span class="owner-badge">MR SAGAR PATEL</span>
    </div>
</footer>

<script>
const urlParams = new URLSearchParams(window.location.search);
const num = urlParams.get('num');

if (!num || num.length !== 10) {
    document.getElementById('loadingBox').innerHTML = `<span style="color:var(--danger);">Invalid target number.</span>`;
} else {
    document.getElementById('targetDisplayNum').textContent = `+91 ${num}`;
    const targetUrl = `https://exploitsindia.site/osint/api.php?key=anish-exploits&type=number&num=${num}`;

    setTimeout(() => {
        document.getElementById('loadingBox').style.display = 'none';
        const btn = document.getElementById('secureLink');
        btn.href = targetUrl;
        document.getElementById('actionArea').style.display = 'block';
    }, 2000);
}
</script>
</body>
</html>
