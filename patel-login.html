<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patel Cyber Security - Access</title>
    <style>
        body { font-family: 'Courier New', Courier, monospace; background: #020617; color: #e0f2fe; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        /* Futuristic Background Glow */
        body::before { content: ''; position: absolute; width: 300px; height: 300px; background: #38bdf8; filter: blur(150px); opacity: 0.2; border-radius: 50%; z-index: -1; }
        
        .glass-panel { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(10px); padding: 40px; border-radius: 15px; width: 320px; text-align: center; border: 1px solid rgba(56, 189, 248, 0.3); box-shadow: 0 0 20px rgba(0,0,0,0.5), inset 0 0 15px rgba(56, 189, 248, 0.1); }
        h2 { color: #38bdf8; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 25px; text-shadow: 0 0 10px rgba(56,189,248,0.6); }
        
        input { width: 90%; padding: 14px; margin: 12px 0; background: rgba(2, 6, 23, 0.7); border: 1px solid #1e293b; color: #fff; border-radius: 8px; outline: none; transition: 0.3s; font-family: 'Courier New', Courier, monospace; }
        input:focus { border-color: #38bdf8; box-shadow: 0 0 10px rgba(56, 189, 248, 0.5); }
        
        button { width: 98%; padding: 14px; background: linear-gradient(90deg, #0284c7, #38bdf8); border: none; color: white; font-weight: bold; font-size: 16px; border-radius: 8px; cursor: pointer; margin-top: 15px; text-transform: uppercase; transition: 0.3s; letter-spacing: 1px; }
        button:hover { box-shadow: 0 0 15px #38bdf8; transform: scale(1.02); }
        
        .error { color: #f43f5e; font-size: 14px; margin-top: 15px; text-shadow: 0 0 5px rgba(244, 63, 94, 0.5); }
    </style>
</head>
<body>

<div class="glass-panel">
    <h2>Cyber Access</h2>
    <input type="text" id="username" placeholder="[ Enter Identity ]">
    <input type="password" id="access-password" placeholder="[ Authentication Key ]">
    <button onclick="verifyAccess()">Initialize</button>
    <div id="error-msg" class="error"></div>
</div>

<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
    
    // Auto-configured keys (Checked and fixed)
    const supabase = createClient('https://eatolkikwxsqlhkitdlj.supabase.co', 'sb_publishable_YOwpG31mpFqkI4NBRPU8GQ_We-8lGun');

    window.verifyAccess = async function() {
        const name = document.getElementById("username").value.trim();
        const pass = document.getElementById("access-password").value.trim();
        const errorDiv = document.getElementById("error-msg");

        if(!name || !pass) { errorDiv.innerText = "Error: Missing Credentials!"; return; }

        errorDiv.innerText = "Authenticating...";
        errorDiv.style.color = "#38bdf8";

        try {
            const { data, error } = await supabase.from('settings').select('tool_password').limit(1);
            if (error) throw error;
            
            if(pass === data[0].tool_password) {
                const dateStr = new Date().toLocaleString();
                await supabase.from('access_logs').insert([{ name: name, login_time: dateStr }]);
                
                localStorage.setItem("patel_user", name);
                window.location.href = "patel-tools.html";
            } else {
                errorDiv.style.color = "#f43f5e";
                errorDiv.innerText = "Access Denied: Invalid Key";
            }
        } catch (e) {
            errorDiv.style.color = "#f43f5e";
            errorDiv.innerText = "System Error: " + e.message;
        }
    }
</script>
</body>
</html>
