<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth | Patel Cyber Tools</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap');
        body { margin:0; background: #030712; color: #fff; font-family: 'Rajdhani', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .auth-card { background: rgba(10,15,30,0.9); border: 1px solid #00f0ff; padding: 40px; border-radius: 10px; width: 400px; text-align: center; box-shadow: 0 0 30px rgba(0,240,255,0.2); }
        .input-box { width: 100%; padding: 15px; margin-bottom: 20px; background: #000; border: 1px solid rgba(0,240,255,0.3); color: #00f0ff; outline: none; font-size: 1.1rem; }
        .btn { width: 100%; padding: 15px; background: #00f0ff; border: none; color: #000; font-size: 1.2rem; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn:hover { background: #fff; box-shadow: 0 0 20px #00f0ff; }
    </style>
</head>
<body>
    <div class="auth-card">
        <h2 style="color:#00f0ff; margin-bottom: 30px;">ADMIN AUTHENTICATION</h2>
        <form onsubmit="event.preventDefault(); window.location.href='patel-admin.html';">
            <input type="text" class="input-box" placeholder="Admin ID" required>
            <input type="password" class="input-box" placeholder="Access Key" required>
            <button type="submit" class="btn">GRANT ACCESS</button>
        </form>
    </div>
</body>
</html>
