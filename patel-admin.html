<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin System - Patel Cyber</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #020617; color: #f1f5f9; padding: 20px; margin: 0; }
        .container { max-width: 1000px; margin: auto; display: none; }
        
        #admin-login-screen { display: flex; justify-content: center; align-items: center; height: 100vh; }
        .lock-box { background: #0f172a; padding: 40px; border-radius: 12px; border: 1px solid #f43f5e; box-shadow: 0 0 20px rgba(244, 63, 94, 0.4); text-align: center; width: 300px; }
        .lock-box h2 { color: #f43f5e; margin-bottom: 20px; font-family: 'Courier New', Courier, monospace; }
        
        input, select { width: 100%; padding: 12px; margin: 10px 0; background: #1e293b; border: 1px solid #334155; color: #fff; border-radius: 6px; box-sizing: border-box; outline: none; }
        input:focus, select:focus { border-color: #38bdf8; }
        
        button { padding: 12px 20px; background: #10b981; color: white; border: none; cursor: pointer; border-radius: 6px; font-weight: bold; transition: 0.3s; text-transform: uppercase; }
        button:hover { filter: brightness(1.2); box-shadow: 0 0 15px currentColor; }
        .btn-danger { background: #ef4444; }
        .btn-small { padding: 8px 12px; font-size: 12px; }

        .dashboard-stats { display: flex; gap: 20px; margin-bottom: 25px; }
        .stat-box { flex: 1; background: #0f172a; padding: 20px; border-radius: 10px; border: 1px solid #38bdf8; text-align: center; }
        .stat-box h1 { margin: 0; color: #38bdf8; font-size: 36px; }

        .card-box { background: rgba(15, 23, 42, 0.8); padding: 25px; margin-bottom: 25px; border-radius: 10px; border: 1px solid #1e293b; }
        h3 { color: #38bdf8; margin-top: 0; border-bottom: 1px solid #1e293b; padding-bottom: 10px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: #0f172a; }
        th, td { border-bottom: 1px solid #1e293b; padding: 12px; text-align: left; }
        th { color: #38bdf8; }
    </style>
</head>
<body>

<div id="admin-login-screen">
    <div class="lock-box">
        <h2>ADMIN LOGIN</h2>
        <input type="password" id="admin-pass" placeholder="[ Enter Master Password ]">
        <button onclick="checkAdmin()" class="btn-danger" style="width:100%;">AUTHORIZE</button>
    </div>
</div>

<div class="container" id="admin-panel">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2 style="color:#38bdf8; font-family:'Courier New';">COMMAND CENTER (v3.0)</h2>
        <button onclick="location.reload()" class="btn-danger">LOGOUT</button>
    </div>
    
    <!-- FEATURE 1 & 2: STATS DASHBOARD -->
    <div class="dashboard-stats">
        <div class="stat-box">
            <h1 id="total-tools">0</h1>
            <p style="color:#94a3b8; margin:5px 0 0;">Total Active Tools</p>
        </div>
        <div class="stat-box">
            <h1 id="total-logs" style="color:#10b981;">0</h1>
            <p style="color:#94a3b8; margin:5px 0 0;">Total Access Logs</p>
        </div>
    </div>

    <!-- FEATURE 3: SECURE TOOL DEPLOYMENT (WITH 100% SOLID IMAGE FIX) -->
    <div class="card-box">
        <h3>🚀 DEPLOY NEW TOOL</h3>
        <input type="text" id="tool-name" placeholder="Tool Name (e.g. Insta Hacker)">
        <input type="text" id="tool-url" placeholder="Tool Link (https://...)">
        <input type="text" id="tool-desc" placeholder="Tool Description">
        
        <label style="color:#94a3b8; font-size:14px;">Select Tool Image Theme:</label>
        <select id="image-preset" onchange="toggleCustomImage()">
            <option value="auto">Auto Random Hacker Image</option>
            <option value="https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?q=80&w=800&auto=format&fit=crop">Green Matrix Code</option>
            <option value="https://images.unsplash.com/photo-1510511459019-5bea15668b57?q=80&w=800&auto=format&fit=crop">Dark Server Room</option>
            <option value="https://images.unsplash.com/photo-1550751827-4bd374c3f58b?q=80&w=800&auto=format&fit=crop">Cyber Lock Tech</option>
            <option value="custom">I will put my own Custom Link</option>
        </select>
        <input type="text" id="tool-img-custom" placeholder="Paste your image URL here..." style="display:none;">
        
        <button onclick="addTool()" style="margin-top:10px; width:100%;">DEPLOY TOOL TO SYSTEM</button>
    </div>

    <!-- FEATURE 4: MANAGE & DELETE TOOLS -->
    <div class="card-box">
        <h3 style="color: #f59e0b;">⚙️ MANAGE / DELETE TOOLS</h3>
        <table>
            <thead><tr><th>Tool Name</th><th>Link</th><th>Action</th></tr></thead>
            <tbody id="manage-tools-table"></tbody>
        </table>
    </div>

    <!-- FEATURE 5: ACCESS LOGS & CLEAR SYSTEM -->
    <div class="card-box">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3 style="color: #8b5cf6;">📊 LIVE ACCESS LOGS</h3>
            <button onclick="clearLogs()" class="btn-danger btn-small">CLEAR ALL LOGS</button>
        </div>
        <input type="text" id="search-log" placeholder="Search user name..." oninput="filterLogs()" style="width:50%;">
        <table>
            <thead><tr><th>Name</th><th>Timestamp</th></tr></thead>
            <tbody id="logs-table"></tbody>
        </table>
    </div>

    <div class="card-box">
        <h3 style="color: #f43f5e;">🔒 CHANGE CUSTOMER PASSWORD</h3>
        <div style="display:flex; gap:10px;">
            <input type="text" id="new-password" placeholder="Enter new password for users">
            <button class="btn-danger" onclick="updatePassword()">UPDATE</button>
        </div>
    </div>
</div>

<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
    const supabase = createClient('https://eatolkikwxsqlhkitdlj.supabase.co', 'sb_publishable_YOwpG31mpFqkI4NBRPU8GQ_We-8lGun');

    const SECRET_ADMIN_PASS = "PATEL@BOSS"; 
    let allLogs = [];

    window.checkAdmin = function() {
        if(document.getElementById("admin-pass").value === SECRET_ADMIN_PASS) {
            document.getElementById("admin-login-screen").style.display = "none";
            document.getElementById("admin-panel").style.display = "block";
            loadDashboard();
        } else alert("WRONG PASSWORD!");
    }

    window.toggleCustomImage = function() {
        const select = document.getElementById("image-preset").value;
        document.getElementById("tool-img-custom").style.display = (select === "custom") ? "block" : "none";
    }

    window.addTool = async function() {
        const name = document.getElementById("tool-name").value.trim();
        const url = document.getElementById("tool-url").value.trim();
        const desc = document.getElementById("tool-desc").value.trim() || "Advanced Cyber Utility";
        const preset = document.getElementById("image-preset").value;
        let img = "";

        if(!name || !url) return alert("Name and URL are required!");

        if(preset === "auto") {
            const autoImages = [
                "https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?q=80&w=800",
                "https://images.unsplash.com/photo-1510511459019-5bea15668b57?q=80&w=800",
                "https://images.unsplash.com/photo-1550751827-4bd374c3f58b?q=80&w=800",
                "https://images.unsplash.com/photo-1563206767-5b18f218e8de?q=80&w=800"
            ];
            img = autoImages[Math.floor(Math.random() * autoImages.length)];
        } else if (preset === "custom") {
            img = document.getElementById("tool-img-custom").value.trim() || "https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?q=80&w=800";
        } else {
            img = preset;
        }
        
        const { error } = await supabase.from('tools').insert([{ name, url, description: desc, image: img }]);
        if(error) alert("Error: " + error.message);
        else { alert("Tool Deployed Successfully!"); loadDashboard(); }
    }

    window.deleteTool = async function(id) {
        if(confirm("Are you sure you want to delete this tool?")) {
            await supabase.from('tools').delete().eq('id', id);
            alert("Tool Deleted!"); loadDashboard();
        }
    }

    window.clearLogs = async function() {
        if(confirm("DANGER: Wipe all user access logs?")) {
            await supabase.from('access_logs').delete().neq('id', 0);
            alert("System Logs Cleared!"); loadDashboard();
        }
    }

    window.updatePassword = async function() {
        const newPass = document.getElementById("new-password").value.trim();
        if(!newPass) return;
        const { error } = await supabase.from('settings').update({ tool_password: newPass }).eq('id', 1);
        if(!error) alert("Customer Password Updated!");
    }

    async function loadDashboard() {
        // Load Tools
        const { data: tools } = await supabase.from('tools').select('*').order('id', { ascending: false });
        document.getElementById("total-tools").innerText = tools.length;
        const tbodyTools = document.getElementById("manage-tools-table");
        tbodyTools.innerHTML = "";
        tools.forEach(t => {
            tbodyTools.innerHTML += `<tr><td>${t.name}</td><td><a href="${t.url}" target="_blank" style="color:#38bdf8;">Link</a></td>
            <td><button class="btn-danger btn-small" onclick="deleteTool(${t.id})">DELETE</button></td></tr>`;
        });

        // Load Logs
        const { data: logs } = await supabase.from('access_logs').select('*').order('id', { ascending: false });
        document.getElementById("total-logs").innerText = logs.length;
        allLogs = logs;
        renderLogs(allLogs);
    }

    window.filterLogs = function() {
        const search = document.getElementById("search-log").value.toLowerCase();
        renderLogs(allLogs.filter(log => log.name.toLowerCase().includes(search)));
    }

    function renderLogs(logs) {
        const tbody = document.getElementById("logs-table");
        tbody.innerHTML = "";
        logs.forEach(log => tbody.innerHTML += `<tr><td style="color:#e2e8f0; font-weight:bold;">${log.name}</td><td style="color:#94a3b8;">${log.login_time}</td></tr>`);
    }
</script>
</body>
</html>
