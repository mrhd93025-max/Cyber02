<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Patel Cyber Tools</title>
    <style>
        :root { --bg-dark: #090d16; --card-bg: rgba(16, 23, 38, 0.85); --border-color: rgba(0, 229, 255, 0.2); --primary-cyan: #00e5ff; --gov-saffron: #ff9933; --text-main: #f0f6fc; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; }
        .gov-top-bar { background: linear-gradient(90deg, #111, #1a2332, #111); color: var(--gov-saffron); padding: 8px 20px; font-size: 0.85rem; font-weight: bold; display: flex; justify-content: space-between; border-bottom: 2px solid var(--gov-saffron); }
        .main-header { background: rgba(13, 19, 33, 0.9); border-bottom: 1px solid var(--border-color); padding: 20px; text-align: center; }
        .main-header h1 { color: var(--primary-cyan); font-size: 1.8rem; }
        .container { padding: 40px 20px; max-width: 800px; margin: 0 auto; }
        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 30px; text-align: center; }
        .btn { display: inline-block; padding: 12px 30px; background: linear-gradient(135deg, #00e5ff, #0072ff); color: #000; font-weight: bold; text-decoration: none; border-radius: 8px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="gov-top-bar">
        <span>🇮🇳 भारत सरकार | GOVERNMENT OF INDIA</span>
        <span>Administrator Dashboard</span>
    </div>
    <header class="main-header">
        <h1>🏛️ Patel Cyber Tools</h1>
        <p style="color: #8b949e; font-size: 0.9rem;">System Control Panel</p>
    </header>
    <div class="container">
        <div class="card">
            <h2 style="color: var(--primary-cyan);">Welcome, Admin</h2>
            <p style="color: #8b949e; margin-top: 10px;">System Status: <span style="color: #0f0;">Online & Secure</span></p>
            <div style="margin-top: 30px; border-top: 1px solid var(--border-color); padding-top: 20px;">
                <h3>Access the Cyber Tool</h3>
                <a href="patel-tools.html" class="btn">Go to Search Portal</a>
            </div>
        </div>
    </div>
</body>
</html>
